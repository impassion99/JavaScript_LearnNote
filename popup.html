<!DOCTYPE html>
<html>
  <head>
    <title>Collapsible Sidebar</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        height: 300px;
        width: 400px;
      }

      /* Sidebar */
      .sidebar {
        width: 150px;
        background-color: #2c3e50;
        color: white;
        padding: 15px;
        box-sizing: border-box;
        transition: width 0.3s ease;
        overflow: hidden;
      }

      .sidebar.collapsed {
        width: 50px;
      }

      .sidebar h2 {
        font-size: 16px;
        margin-top: 0;
      }

      .sidebar ul {
        list-style: none;
        padding: 0;
      }

      .sidebar ul li {
        margin: 10px 0;
        cursor: pointer;
      }

      /* Main content */
      .content {
        flex: 1;
        padding: 20px;
        background-color: #ecf0f1;
      }

      .toggle-btn {
        background-color: #3498db;
        border: none;
        color: white;
        padding: 5px 10px;
        cursor: pointer;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <button class="toggle-btn" id="toggleBtn">☰</button>
      <h2>Menu</h2>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Settings</li>
      </ul>
    </div>
    <div class="content">
      <h1>Hello, World!</h1>
      <button id="btn">Click Me</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
